name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Desktop examples link the system WebView, as in the Dioxus Linux setup.
      - name: Install Linux WebView libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libssl-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Pull requests run the default CI set from docs/quality-gates.md; the
      # release aggregate adds the slow per-feature builds, so it runs on main.
      - name: Run the pull request checks
        if: github.event_name == 'pull_request'
        run: |
          cargo check --workspace --all-features
          cargo test --workspace --all-features
          cargo test -p dioxus-shadcn-cli --test registry
          scripts/generated-fixture-smoke.sh
          npm run verify

      # The class merge checks in the release aggregate read styles in Chromium.
      - name: Install Playwright Chromium
        if: github.event_name == 'push'
        run: npx playwright install --with-deps chromium

      - name: Run the release gate
        if: github.event_name == 'push'
        run: npm run verify:release
