[workspace]
resolver = "2"
members = [
  "crates/dioxus-shadcn-core",
  "crates/dioxus-shadcn-primitives",
  "crates/dioxus-shadcn",
  "crates/dioxus-shadcn-cli",
  "examples/web-demo",
  "examples/desktop-demo",
  "examples/mobile-demo",
  "examples/preview-states",
  "examples/runtime-web-verification",
  "examples/runtime-desktop-verification",
  "examples/class-merge-gate",
  "examples/fullstack-hydration",
  "site",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/yuxuetr/dioxus-ui"
readme = "crates/README.md"
keywords = ["dioxus", "ui", "tailwind", "components"]
categories = ["gui", "web-programming"]

[workspace.dependencies]
dioxus = "0.7"
dioxus-shadcn-core = { version = "0.6.0", path = "crates/dioxus-shadcn-core" }
dioxus-shadcn-primitives = { version = "0.6.0", path = "crates/dioxus-shadcn-primitives" }
dioxus-shadcn = { version = "0.6.0", path = "crates/dioxus-shadcn" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
debug = false
