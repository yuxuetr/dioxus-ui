[workspace]
resolver = "2"
members = [
  "crates/dioxus-ui-core",
  "crates/dioxus-ui-primitives",
  "crates/dioxus-ui",
  "crates/dioxus-ui-cli",
  "examples/web-demo",
  "examples/desktop-demo",
  "examples/mobile-demo",
  "examples/preview-states",
  "examples/runtime-web-verification",
  "examples/runtime-desktop-verification",
  "site",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/yuxuetr/dioxus-ui"
readme = "README.md"
keywords = ["dioxus", "ui", "tailwind", "components"]
categories = ["gui", "web-programming"]

[workspace.dependencies]
dioxus = "0.7"
dioxus-ui-core = { version = "0.1.0", path = "crates/dioxus-ui-core" }
dioxus-ui-primitives = { version = "0.1.0", path = "crates/dioxus-ui-primitives" }
dioxus-ui = { version = "0.1.0", path = "crates/dioxus-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
debug = false
