[workspace]
resolver = "2"
members = [
  "crates/dioxus-ui-core",
  "crates/dioxus-ui-primitives",
  "crates/dioxus-ui",
  "crates/dioxus-ui-cli",
  "examples/web-demo",
  "examples/desktop-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/dioxus-ui"

[workspace.dependencies]
dioxus-ui-core = { path = "crates/dioxus-ui-core" }
dioxus-ui-primitives = { path = "crates/dioxus-ui-primitives" }
dioxus-ui = { path = "crates/dioxus-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
debug = false
