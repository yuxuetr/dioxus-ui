# cargo-deny configuration (schema v2, cargo-deny 0.18+).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# v2 always denies vulnerabilities; unmaintained is scoped to direct deps.
unmaintained = "workspace"
yanked = "warn"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "Zlib",
  "NCSA",
  "MPL-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CC0-1.0",
]
confidence-threshold = 0.8
# Only dioxus-fullstack pulls these in, for examples/fullstack-hydration: the
# Mozilla root certificates (CDLA-Permissive-2.0) and xxhash (BSL-1.0). Both
# are permissive; they stay scoped to the crate rather than allowed for all.
exceptions = [
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
  { allow = ["BSL-1.0"], crate = "xxhash-rust" },
]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
